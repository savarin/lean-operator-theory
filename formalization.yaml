# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "lean-operator-theory"
  description: >-
    Hilbert-space operator theory from unitary power dilation through von
    Neumann's polynomial inequality, together with the Crouzeix--Palencia
    theorem that the closed numerical range is a
    (1 + square-root-of-2)-polynomial spectral set.
  authors:
    - "Ezzeri Esa"
  responsible_maintainers:
    - "Ezzeri Esa"
  license: "Apache-2.0"

classification:
  arxiv: ["math.FA", "math.OA"]
  msc2020: ["47A12", "47A20", "47A25", "47A30"]

sources:
  - title: "The numerical range is a (1+sqrt 2)-spectral set"
    authors:
      - "Michel Crouzeix"
      - "César Palencia"
    type: "paper"
    id: "10.1137/17M1116672"
    location: "Main theorem"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The Lean capstone records the polynomial-functional-calculus
      specialization of the paper's stronger spectral-set theorem.
  - title: "Harmonic Analysis of Operators on Hilbert Space"
    authors:
      - "Béla Sz.-Nagy"
      - "Ciprian Foias"
      - "Hari Bercovici"
      - "László Kérchy"
    type: "book"
    id: "10.1007/978-1-4419-6094-8"
    location: "Chapters 2–4"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
  - title: "Remarks on the Crouzeix--Palencia proof that the numerical range is a (1+sqrt 2)-spectral set"
    authors:
      - "Thomas Ransford"
      - "Felix Schwenninger"
    type: "paper"
    id: "10.1137/17M1143757"
    location: "Main theorem"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The Crouzeix--Palencia bound follows the Ransford--Schwenninger
      short proof via a quartic inequality, not the original 2017 paper.

status:
  scope: >-
    Three compared theorems and zero definition holes.
    CrouzeixPalenciaChallenge.lean is a 63-line Mathlib-only module with
    complete definitions of the numerical
    range, polynomial supremum norm, and polynomial spectral-set predicate,
    all inside the PalomarCrouzeixPalencia namespace. The proof development
    contains no unresolved proof placeholders outside the three deliberate
    Challenge theorem placeholders. No numerical-range or von Neumann
    inequality material exists in Mathlib at v4.33.0; cross-prover novelty
    has not been searched.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "PalomarCrouzeixPalencia.exists_unitary_power_dilation"
      file: "CrouzeixPalenciaSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-crouzeix-palencia.json"
    - declaration: "PalomarCrouzeixPalencia.vonNeumann_inequality"
      file: "CrouzeixPalenciaSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-crouzeix-palencia.json"
    - declaration: "PalomarCrouzeixPalencia.crouzeix_palencia"
      file: "CrouzeixPalenciaSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-crouzeix-palencia.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable (Anthropic)", "GPT 5.6 Sol (OpenAI)"]
      framework: "Codex, Claude Code, and a local multi-agent coordination harness"
      tool_setup: >-
        Claude Code and Codex multi-agent sessions constructed, compiled,
        adversarially reviewed, and axiom-audited the proof library. Codex
        designed and verified the compact Palomar publication boundary and
        packaging.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
  notes: >-
    The development used exact boundary signatures and staged verification.
    An initially proposed fixed-domain product lemma in the
    Crouzeix--Palencia route was disproved by a formal counterexample and
    retired; the final unconditional capstone follows a different valid
    smooth-support outer-approximation route.

fidelity:
  divergences: >-
    The unitary dilation is stated existentially on a larger Hilbert space in
    the same universe and includes compression of every natural power. The
    selected von Neumann theorem is for complex polynomials and the closed
    unit disk. The selected Crouzeix--Palencia theorem concerns polynomial
    evaluation on the closure of the numerical range; the source article
    proves a stronger rational/holomorphic spectral-set result.

review:
  status: "agent-reviewed"
  reviewers:
    - "Ezzeri Esa"
    - "Claude Code (Anthropic)"
    - "Codex (OpenAI)"
  notes: >-
    The production source was scanned for unresolved placeholders. All three
    selected declarations elaborate with exactly propext, Classical.choice,
    and Quot.sound. On 2026-08-30 the 63-line Mathlib-only Challenge and
    Solution passed a local Comparator run using Lean's default kernel and a
    development fake-Landrun wrapper. That run predates the 2026-08-31
    namespace-bridge fix (PalomarCrouzeixPalencia): the Challenge and the
    proof library had independently declared same-named top-level copies of
    numericalRange, polynomialSupNorm, and IsKPolynomialSpectralSet, which
    elaborated to non-matching internals and broke the comparator after the
    2026-08-30 file renames. The Challenge now declares its boundary inside
    the PalomarCrouzeixPalencia namespace and the Solution redeclares it as a
    bridge, delegating each theorem to the library via `_root_`. Re-run
    2026-08-31 at the fixed HEAD: all three declarations pass. An adversarial
    factor-of-two weakening of von Neumann's bound was rejected specifically
    at that declaration while the other two declarations continued to match.
    A protected NanoDa run remains pending.

    Human review (Ezzeri Esa): verified the Challenge theorem statements
    against the source papers (Crouzeix--Palencia, Ransford--Schwenninger)
    and Sz.-Nagy--Foias. Lean proof code produced by AI agents under the
    author's direction.

alignment:
  statements:
    - source: "Sz.-Nagy--Foias, unitary dilation theorem"
      lean: "PalomarCrouzeixPalencia.exists_unitary_power_dilation"
      module: "CrouzeixPalenciaSolution"
      status: "proved"
      note: "Every contraction has a unitary dilation compressing all natural powers."
    - source: "Sz.-Nagy--Foias, von Neumann inequality"
      lean: "PalomarCrouzeixPalencia.vonNeumann_inequality"
      module: "CrouzeixPalenciaSolution"
      status: "proved"
      note: "Polynomial norm bound for contractions on the complex closed unit disk."
    - source: "Crouzeix--Palencia, main theorem"
      lean: "PalomarCrouzeixPalencia.crouzeix_palencia"
      module: "CrouzeixPalenciaSolution"
      status: "proved"
      note: >-
        Polynomial specialization with exact constant 1 + square root of 2
        on the closure of the numerical range.

acknowledgements: >-
  Mathlib contributors; leanprover/comparator and NanoDa maintainers.
