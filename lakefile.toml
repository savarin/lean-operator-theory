name = "lean-operator-theory"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Operator", "CrouzeixPalenciaChallenge", "CrouzeixPalenciaSolution"]

[leanOptions]
weak.linter.mathlibStandardSet = true
autoImplicit = false
relaxedAutoImplicit = false
linter.unusedVariables = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[lean_lib]]
name = "Operator"

[[lean_lib]]
name = "CrouzeixPalenciaChallenge"

[[lean_lib]]
name = "CrouzeixPalenciaSolution"
